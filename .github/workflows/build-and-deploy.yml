name: Build & Deploy
on:
  push:
    branches: [ main ]

# Add explicit permissions for GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Ship only the site itself; docs, tooling and config stay out
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='*.md' --exclude='.DS_Store' index.html 404.html css js assets binaural-externalization binaural-externalization.html model-benchmarks _site/
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/binaural-externalization.html
          echo "files: $(find _site -type f | wc -l)  size: $(du -sm _site | cut -f1) MB"
          test "$(du -sm _site | cut -f1)" -lt 500
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 